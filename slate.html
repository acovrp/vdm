<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verma Dental World · Stay in touch</title>
<style>
@font-face{font-family:Anton;src:url(anton-400.woff2) format('woff2');font-display:swap}
@font-face{font-family:Jost;src:url(jost-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Jost;src:url(jost-600.woff2) format('woff2');font-weight:600;font-display:swap}
html,body{margin:0;height:100%;background:#0B1A14;color:#F3EFE3;font-family:Jost,system-ui,sans-serif;overflow:hidden}
body{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:4vw;padding:6vw 7vw}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(54px,8.6vw,132px);line-height:.86;text-transform:uppercase;margin:0 0 2.4vw;letter-spacing:-.01em}

p{margin:0;font-size:clamp(16px,1.55vw,26px);color:#A8B6AF}
.name{color:#F3EFE3;font-weight:600;margin-top:2.2vw;font-size:clamp(20px,2.2vw,34px)}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:1.6vw}
figure img{width:100%;max-width:520px;display:block;background:#fff;padding:3%}
figcaption{font-size:clamp(13px,1.25vw,20px);color:#A8B6AF;text-align:center;line-height:1.5}
.brand{position:fixed;left:7vw;top:5vw;font-size:clamp(11px,1vw,15px);letter-spacing:.18em;text-transform:uppercase;color:#A8B6AF}
.rule{width:9vw;height:3px;background:#D8381C;margin:2.6vw 0}

<figure><img src="qr.svg" alt="Scan to call, save the contact or open Verma Dental World"><figcaption>Open your camera. Scan. Stay in touch.<br><span lang="hi">कैमरा खोलें। स्कैन करें। जुड़ें।</span></figcaption></figure>
</body></html>
