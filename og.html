<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verma Dental World</title>
<style>
@font-face{font-family:Anton;src:url(anton-400.woff2) format('woff2');font-display:block}
@font-face{font-family:Jost;src:url(jost-400.woff2) format('woff2');font-weight:400;font-display:block}
@font-face{font-family:Jost;src:url(jost-600.woff2) format('woff2');font-weight:600;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:52.5vw;overflow:hidden;background:#0B1A14;font-family:Jost,sans-serif;color:#F3EFE3}
.card{position:relative;width:100vw;height:52.5vw;display:grid;grid-template-columns:1fr 39.2vw}
.copy{padding:5.3vw 0 0 6vw;display:flex;flex-direction:column}
.brand{font-size:1.25vw;letter-spacing:.22em;text-transform:uppercase;color:#9FB0A6;margin-bottom:2.2vw}
h1{font-family:Anton,sans-serif;font-weight:400;font-size:9.33vw;line-height:.84;letter-spacing:-.02em;text-transform:uppercase}
h1 em{font-style:normal;color:transparent;-webkit-text-stroke:.17vw #F3EFE3}
h1 b{font-weight:400;color:#F3EFE3}
.who{margin-top:1.8vw;font-size:1.83vw;line-height:1.3;color:#9FB0A6}
.who strong{display:block;color:#F3EFE3;font-weight:600;font-size:2.16vw;margin-bottom:.2vw}
.tel{margin-top:auto;margin-bottom:4.4vw;font-family:Anton,sans-serif;font-size:3.83vw;color:#E4401F;letter-spacing:.01em}
.face{position:relative;overflow:hidden;background:#0F231A}
.face img{width:100%;height:100%;object-fit:cover;object-position:50% 6%;filter:grayscale(1) contrast(1.15) brightness(.85)}
.face::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0B1A14 0%,rgba(11,26,20,.3) 22%,rgba(11,26,20,0) 55%)}
</style></head><body>
<div class="card">
  <div class="copy">
    <p class="brand">Verma Dental World</p>
    <h1><b>Verma</b><br><em>Dental</em><br><b>World</b></h1>
    <p class="who"><strong>Dr. Adarsh Verma</strong>Oro-dental Implantologist · Delhi, India</p>
    <p class="tel">+91 97113 44420</p>
  </div>
  <div class="face"><img src="portrait.jpg" alt=""></div>
</div>
</body></html>
